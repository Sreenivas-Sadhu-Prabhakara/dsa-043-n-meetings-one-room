<text x="56.0" y="216.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">Greedy sweep: take 1-2. Next whose start is after 2: 3-4 — take. 0-6 started long</text>
